name: sp_mobile
description: Lightweight offline-first mobile POS for cashiers and owners.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  mobile_scanner: ^6.0.2
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  print_bluetooth_thermal: 1.2.1
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
